# LIVE-MCX — real-broker gateway. Production uses the VPS host-level nginx;
# enable the optional container ingress only on hosts without another proxy.
#
#   nginx     optional container ingress (TLS + WebSockets), opt-in profile
#   live-mcx  real-broker gateway (live.run, live/data/db, port 8001)
#
# Production VPS uses host-level nginx to proxy to loopback port 8001. The
# optional container ingress must not be enabled on that host because it binds
# the same public ports. live-mcx keeps its own DB volume and env file.
# Generate env files with:  python scripts/gen_service_envs.py
# For container ingress, TLS certs must exist: ./nginx/certs/live.crt + live.key
name: live-only

services:
  nginx:
    profiles: ["container-ingress"]
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: live-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - trading_backend
    depends_on:
      live-mcx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
        reservations: { memory: 16M }

  live-mcx:
    build:
      context: .
      dockerfile: services/live-mcx/Dockerfile
    container_name: live-mcx
    # The VPS also runs host-level Nginx, which proxies to localhost:8001.
    # Bind only loopback so the gateway remains behind that reverse proxy.
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env.live
    volumes:
      - live_db:/app/live/data/db
      - live_mcx_logs:/app/logs/live-mcx
    networks:
      - trading_backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 256M }

networks:
  trading_backend:
    driver: bridge

volumes:
  live_db:
    name: live_mcx_db
  live_mcx_logs:
    name: live_mcx_logs
