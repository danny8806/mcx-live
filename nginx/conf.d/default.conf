# LIVE-MCX — single real-broker gateway behind nginx (no demo/paper services).
#
# TLS certs are mounted from ./nginx/certs and must exist before nginx boots:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#     -keyout nginx/certs/live.key -out nginx/certs/live.crt \
#     -subj "/CN=localhost"
#
# Every route (API + WebSocket + SPA) proxies to the live-mcx gateway on 8001.
# The SPA runs same-origin (APP_API_BASE="" / APP_WS_BASE="" in .env.live).

upstream live_mcx_backend { server live-mcx:8001; }

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/live.crt;
    ssl_certificate_key /etc/nginx/certs/live.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://live_mcx_backend;
        include proxy_params;
        limit_req zone=api_limit burst=60 nodelay;
    }

    location /ws {
        proxy_pass http://live_mcx_backend;
        include ws_params;
    }

    location / {
        proxy_pass http://live_mcx_backend;
        include proxy_params;
    }

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}